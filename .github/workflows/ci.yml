name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  coding-standards:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        php-version:
          - '8.3'
        dependencies:
          - 'highest'

    steps:
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache Composer packages
        id: composer-cache
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-

      - name: Install lowest dependencies
        if: matrix.dependencies == 'lowest'
        run: composer update --prefer-dist --prefer-lowest --no-progress

      - name: Install locked dependencies
        if: matrix.dependencies == 'locked'
        run: composer install --prefer-dist --no-progress

      - name: Install highest dependencies
        if: matrix.dependencies == 'highest'
        run: composer update --prefer-dist --no-progress

      - name: Run coding standards
        run: composer run-script test:cs

  static-code-analysis:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        php-version:
          - '8.3'
        dependencies:
          - 'highest'

    steps:
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache Composer packages
        id: composer-cache
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-

      - name: Install lowest dependencies
        if: matrix.dependencies == 'lowest'
        run: composer update --prefer-dist --prefer-lowest --no-progress

      - name: Install locked dependencies
        if: matrix.dependencies == 'locked'
        run: composer install --prefer-dist --no-progress

      - name: Install highest dependencies
        if: matrix.dependencies == 'highest'
        run: composer update --prefer-dist --no-progress

      - name: Run static code analysis
        run: composer run-script test:phpstan

  tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php-version:
          - '8.3'
          - '8.4'
          - '8.5'
        dependencies:
          - 'highest'

    steps:
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache Composer packages
        id: composer-cache
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-

      - name: Install lowest dependencies
        if: matrix.dependencies == 'lowest'
        run: composer update --prefer-dist --prefer-lowest --no-progress

      - name: Install locked dependencies
        if: matrix.dependencies == 'locked'
        run: composer install --prefer-dist --no-progress

      - name: Install highest dependencies
        if: matrix.dependencies == 'highest'
        run: composer update --prefer-dist --no-progress

      - name: Run tests
        run: composer run-script test:phpunit

  integration-tests:
    name: integration-tests (${{ matrix.database }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - database: 'mysql'
            start: 'docker run -d -e MYSQL_ROOT_PASSWORD=test -e MYSQL_DATABASE=test -p 127.0.0.1:3306:3306 mysql:8.4'
            dsn: 'pdo-mysql://root:test@127.0.0.1:3306/test'
          - database: 'mysql-lowest'
            start: 'docker run -d -e MYSQL_ROOT_PASSWORD=test -e MYSQL_DATABASE=test -p 127.0.0.1:3306:3306 mysql:8.4'
            dsn: 'pdo-mysql://root:test@127.0.0.1:3306/test'
            composer-flags: '--prefer-lowest'
          - database: 'mariadb'
            start: 'docker run -d -e MARIADB_ROOT_PASSWORD=test -e MARIADB_DATABASE=test -p 127.0.0.1:3306:3306 mariadb:11.4'
            dsn: 'pdo-mysql://root:test@127.0.0.1:3306/test'
          - database: 'postgres'
            start: 'docker run -d -e POSTGRES_PASSWORD=test -e POSTGRES_DB=test -p 127.0.0.1:5432:5432 postgres:17'
            dsn: 'pdo-pgsql://postgres:test@127.0.0.1:5432/test'

    steps:
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, pdo_pgsql, posix

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Start database
        run: ${{ matrix.start }}

      # The integration tests rely on limit and rollback, drop this once subscription engine 2.0 is released
      - name: Require subscription engine 2.x
        run: composer require --no-update wwwision/subscription-engine:2.x-dev

      - name: Install dependencies
        run: composer update --prefer-dist --no-progress ${{ matrix.composer-flags }}

      - name: Run tests
        run: composer run-script test:phpunit
        env:
          TEST_DATABASE_DSN: ${{ matrix.dsn }}
